<meta charset="utf-8">
<title>最佳潛力獎 - 投影畫面</title>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<style>
:root{--bg:#080d1c;--line:rgba(255,255,255,.11);--gold:#f5c451;--txt:#f2f5ff;--sub:#8e9ac0}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--txt);
  font-family:"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif}
body{background:
  radial-gradient(90% 70% at 12% -10%,rgba(245,196,81,.16),transparent 60%),
  radial-gradient(80% 70% at 92% 110%,rgba(80,120,255,.16),transparent 60%),var(--bg)}
.layer{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
  flex-direction:column;opacity:0;pointer-events:none;transition:opacity .8s ease}
.layer.on{opacity:1}

#idle .kick{font-size:1.4vh;letter-spacing:.8em;color:var(--gold);margin-bottom:3vh}
#idle h1{font-size:8vh;letter-spacing:.18em;font-weight:800}
#idle .dots{margin-top:4vh;display:flex;gap:1.4vh}
#idle .dots i{width:1.4vh;height:1.4vh;border-radius:50%;background:var(--sub);animation:blink 1.4s infinite}
#idle .dots i:nth-child(2){animation-delay:.2s}
#idle .dots i:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,100%{opacity:.25}50%{opacity:1}}

#award .ttl{font-size:5.4vh;font-weight:800;letter-spacing:.42em;color:var(--gold);
  margin-bottom:1.4vh;opacity:0;transform:translateY(2.5vh);transition:all .9s cubic-bezier(.2,1,.25,1)}
#award .sub{font-size:1.5vh;letter-spacing:.6em;color:var(--sub);margin-bottom:6vh;
  opacity:0;transition:opacity .9s .2s}
#award .halo{position:relative;display:flex;align-items:center;justify-content:center;
  opacity:0;transform:scale(.82);transition:all 1s cubic-bezier(.2,1,.28,1)}
#award .halo::before{content:"";position:absolute;width:52vh;height:52vh;border-radius:50%;
  background:radial-gradient(circle,rgba(245,196,81,.30),transparent 68%);animation:breathe 3.4s ease-in-out infinite}
@keyframes breathe{0%,100%{transform:scale(1);opacity:.75}50%{transform:scale(1.09);opacity:1}}
#award .chip{position:relative;width:36vh;height:36vh;border-radius:50%;object-fit:cover;
  border:.8vh solid var(--gold);box-shadow:0 0 9vh rgba(245,196,81,.45)}
#award .nm{font-size:7.4vh;font-weight:800;letter-spacing:.1em;margin-top:5vh;text-align:center;
  opacity:0;transform:translateY(2.5vh);transition:all .9s cubic-bezier(.2,1,.25,1)}
#award.go .ttl,#award.go .nm{opacity:1;transform:none}
#award.go .sub{opacity:1}
#award.go .halo{opacity:1;transform:none}

.warn{position:fixed;left:2vw;bottom:1.4vh;font-size:1.2vh;color:#e0555f;letter-spacing:.16em;display:none}
.warn.on{display:block}
</style>
</head>

const TEAMS = [
  {no:1,  name:"增站運籌科技",  color:"#e5484d", logo:LOGOS[1]},
  {no:2,  name:"超妡科技",      color:"#e5793a", logo:LOGOS[2]},
  {no:3,  name:"睿加科技",      color:"#f5c451", logo:LOGOS[3]},
  {no:4,  name:"信誠金融科技",  color:"#8fbf3f", logo:LOGOS[4]},
  {no:5,  name:"律果科技",      color:"#3fbf86", logo:LOGOS[5]},
  {no:6,  name:"內定",          color:"#3fb5bf", logo:LOGOS[6]},
  {no:7,  name:"台灣碳梭科技",  color:"#4a8ff0", logo:LOGOS[7]},
  {no:8,  name:"科淨能源",      color:"#6f6ff0", logo:LOGOS[8]},
  {no:9,  name:"繁晶科技",      color:"#a45ff0", logo:LOGOS[9]},
  {no:10, name:"電電數位",      color:"#e05fae", logo:LOGOS[10]}
];
/* ================================================== */

firebase.initializeApp(FB_CONFIG);
const db=firebase.database();

let amounts={}, state="idle";

function ranked(){
  return TEAMS.map(t=>({...t, v:+(amounts[t.no]||0)}))
              .sort((a,b)=> b.v-a.v || a.no-b.no);
}
function show(id){
  ["idle","award"].forEach(k=>document.getElementById(k).classList.toggle("on", k===id));
}
function render(){
  if(state!=="running"){
    show("idle");
    document.getElementById("award").classList.remove("go");
    return;
  }
  const t=ranked()[AWARD_RANK-1];
  if(!t) return;
  document.getElementById("chipBox").innerHTML = t.logo
    ? '<img class="chip" src="'+t.logo+'" alt="">'
    : '<span class="chip" style="background:'+t.color+';display:inline-block"></span>';
  document.getElementById("awName").textContent = t.name;
  show("award");
  const aw=document.getElementById("award");
  aw.classList.remove("go");
  requestAnimationFrame(()=>requestAnimationFrame(()=>aw.classList.add("go")));
}

db.ref(DB_ROOT+"/amounts").on("value", s=>{ amounts=s.val()||{}; if(state==="running") render(); });
db.ref(DB_ROOT+"/potential").on("value", s=>{ state=s.val()||"idle"; render(); });
db.ref(".info/connected").on("value", s=>{
  document.getElementById("warn").classList.toggle("on", !s.val());
});
</script>
