<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>實際結果 - 後台輸入</title>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0b1020;color:#eef1fa;font-family:"PingFang TC","Noto Sans TC",sans-serif;padding:24px}
.wrap{max-width:820px;margin:0 auto}
h1{font-size:20px;letter-spacing:.08em;margin-bottom:4px}
.sub{font-size:12px;color:#8e9ac0;letter-spacing:.1em;margin-bottom:20px}
.state{display:inline-flex;align-items:center;gap:8px;padding:8px 14px;border-radius:20px;
  border:1px solid #2c3557;background:#151c33;font-size:13px;margin-bottom:20px}
.state .d{width:9px;height:9px;border-radius:50%;background:#8e9ac0}
.state.run .d{background:#f5c451;box-shadow:0 0 8px #f5c451}
.states{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:20px}
.states .state{margin-bottom:0}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:24px}
.panel{background:#151c33;border:1px solid #2c3557;border-radius:12px;padding:16px}
.panel h2{font-size:12px;letter-spacing:.24em;color:#8e9ac0;font-weight:600;margin-bottom:14px}
.frow{display:flex;align-items:center;gap:10px;margin-bottom:9px}
.dot{width:14px;height:14px;border-radius:50%;flex:none}
.frow .nm{flex:1;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.frow input{width:110px;padding:8px 10px;border-radius:8px;border:1px solid #2c3557;background:#0f1428;
  color:#eef1fa;font-size:15px;font-weight:700;text-align:right;font-family:inherit;
  font-variant-numeric:tabular-nums;-moz-appearance:textfield}
.frow input::-webkit-outer-spin-button,.frow input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.frow input:focus{outline:none;border-color:#f5c451}
.frow .u{font-size:12px;color:#8e9ac0;width:16px}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:8px 6px;text-align:left;border-bottom:1px solid #232b48}
th{font-size:11px;letter-spacing:.18em;color:#8e9ac0;font-weight:600}
td.r{text-align:right;font-variant-numeric:tabular-nums}
tr:last-child td{border-bottom:none}
.medal{font-weight:800}
.m1{color:#f5c451}.m2{color:#cfd8ec}.m3{color:#d79a5b}.m4{color:#6fd39b;font-size:12px;letter-spacing:.1em}
.acts{display:flex;gap:10px;margin-top:20px;flex-wrap:wrap}
button{padding:11px 18px;border-radius:9px;border:1px solid #2c3557;background:#1b2340;color:#eef1fa;
  font-family:inherit;font-size:14px;cursor:pointer}
button.primary{background:linear-gradient(160deg,#f5c451,#e0a92f);color:#241a00;border:none;font-weight:700}
button.danger{background:#3a1d24;border-color:#77303f;color:#ffc9d2}
.tag{font-size:11px;color:#4d5678;letter-spacing:.14em;margin-top:16px;line-height:1.9}
.saved{color:#3ad07a;font-size:13px;margin-left:10px;opacity:0;transition:.3s}
.saved.on{opacity:1}
@media(max-width:720px){.cols{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
  <h1>實際結果 ・ 後台輸入</h1>
  <div class="sub" id="modeTag">—</div>

  <div class="states">
    <div class="state" id="stateTop3"><span class="d"></span><span id="txtTop3">讀取中…</span></div>
    <div class="state" id="statePot"><span class="d"></span><span id="txtPot">讀取中…</span></div>
  </div>

  <div class="cols">
    <div class="panel">
      <h2>各組獲得投資金額</h2>
      <div id="form"></div>
    </div>
    <div class="panel">
      <h2>目前排名預覽</h2>
      <table>
        <thead><tr><th>名次</th><th>組別</th><th class="r">金額（萬）</th></tr></thead>
        <tbody id="tb"></tbody>
      </table>
    </div>
  </div>

  <div class="acts">
    <button class="primary" id="save">儲存金額</button><span class="saved" id="saved">已儲存</span>
    <button id="resetTop3">重置前三名狀態</button>
    <button id="resetPot">重置最佳潛力獎狀態</button>
    <button class="danger" id="clr">清除所有金額</button>
  </div>

  <div class="tag">
    金額單位為萬元整數，未輸入視為 0。<br>
    投影畫面只會在控制器按下後才播放，儲存金額不會觸發動畫。<br>
    最佳潛力獎取排名第 4 名，畫面只顯示 LOGO 與公司名稱，不顯示名次與金額。<br>
    要重播：按對應的重置按鈕，該投影會回到等待畫面，控制器該顆按鈕也會復原。
  </div>
</div>

<script>
/* ===================== 設定區 ===================== */
const FB_CONFIG = {
  apiKey:            "AIzaSyDl_NqANwk_lsfEL5kOyC1RJi29DLvGPU8",
  authDomain:        "kuya-candy-game.firebaseapp.com",
  databaseURL:       "https://kuya-candy-game-default-rtdb.firebaseio.com",
  projectId:         "kuya-candy-game",
  storageBucket:     "kuya-candy-game.firebasestorage.app",
  messagingSenderId: "105923267148",
  appId:             "1:105923267148:web:1f0e0db9de8cc2876c42e9"
};
const DB_ROOT    = "result";
const ADMIN_PASS = "kuya2026";
const TEAMS = [
  {no:1,  name:"增站運籌科技",       color:"#e5484d"},
  {no:2,  name:"超妡科技",         color:"#e5793a"},
  {no:3,  name:"睿加科技",       color:"#f5c451"},
  {no:4,  name:"信誠金融科技", color:"#8fbf3f"},
  {no:5,  name:"律果科技",      color:"#3fbf86"},
  {no:6,  name:"內定",   color:"#3fb5bf"},
  {no:7,  name:"台灣碳梭科技",        color:"#4a8ff0"},
  {no:8,  name:"科淨能源",      color:"#6f6ff0"},
  {no:9,  name:"繁晶科技",     color:"#a45ff0"},
  {no:10, name:"電電數位",        color:"#e05fae"}
];
/* ================================================== */

firebase.initializeApp(FB_CONFIG);
const db=firebase.database();
document.getElementById("modeTag").textContent="Firebase 連線中 ・ 節點 "+DB_ROOT;

const form=document.getElementById("form");
TEAMS.forEach(t=>{
  const d=document.createElement("div");
  d.className="frow";
  d.innerHTML='<span class="dot" style="background:'+t.color+'"></span>'+
    '<span class="nm">'+t.name+'</span>'+
    '<input type="number" min="0" step="1" placeholder="0" data-no="'+t.no+'">'+
    '<span class="u">萬</span>';
  form.appendChild(d);
});
form.addEventListener("input", preview);

function current(){
  const o={};
  form.querySelectorAll("input").forEach(i=>{
    let v=parseInt(i.value,10); if(isNaN(v)||v<0) v=0;
    o[i.dataset.no]=v;
  });
  return o;
}

function preview(){
  const a=current();
  const arr=TEAMS.map(t=>({...t,v:a[t.no]||0})).sort((x,y)=>y.v-x.v||x.no-y.no);
  document.getElementById("tb").innerHTML = arr.map((x,i)=>
    '<tr><td class="medal '+(i<3?"m"+(i+1):(i===3?"m4":""))+'">'+(i===3?"潛力":(i+1))+'</td>'+
    '<td><span class="dot" style="background:'+x.color+';display:inline-block;margin-right:8px;vertical-align:-2px"></span>'+x.name+'</td>'+
    '<td class="r">'+x.v.toLocaleString()+'</td></tr>').join("");
}
preview();

db.ref(DB_ROOT+"/amounts").on("value", s=>{
  const a=s.val()||{};
  form.querySelectorAll("input").forEach(i=>{
    if(document.activeElement!==i){
      const v=a[i.dataset.no];
      i.value = (v===undefined||v===null||v===0) ? "" : v;
    }
  });
  preview();
});

db.ref(DB_ROOT+"/reveal").on("value", s=>{
  const running = s.val()==="running";
  document.getElementById("stateTop3").classList.toggle("run",running);
  document.getElementById("txtTop3").textContent = running ? "前三名：已公布" : "前三名：待命中";
});
db.ref(DB_ROOT+"/potential").on("value", s=>{
  const running = s.val()==="running";
  document.getElementById("statePot").classList.toggle("run",running);
  document.getElementById("txtPot").textContent = running ? "最佳潛力獎：已公布" : "最佳潛力獎：待命中";
});

document.getElementById("save").onclick = async ()=>{
  try{
    await db.ref(DB_ROOT+"/amounts").set(current());
    const s=document.getElementById("saved");
    s.classList.add("on"); setTimeout(()=>s.classList.remove("on"),1400);
  }catch(e){ alert("儲存失敗："+e.message); }
};

document.getElementById("resetTop3").onclick = async ()=>{
  if(!confirm("重置前三名狀態？投影-1 會回到等待結果。")) return;
  try{ await db.ref(DB_ROOT).update({reveal:"idle", revealAt:0}); }
  catch(e){ alert("重置失敗："+e.message); }
};

document.getElementById("resetPot").onclick = async ()=>{
  if(!confirm("重置最佳潛力獎狀態？投影-2 會回到等待結果。")) return;
  try{ await db.ref(DB_ROOT).update({potential:"idle", potentialAt:0}); }
  catch(e){ alert("重置失敗："+e.message); }
};

document.getElementById("clr").onclick = async ()=>{
  if(prompt("輸入管理密碼以清除全部金額")!==ADMIN_PASS) return;
  if(!confirm("確定清除所有金額？此操作不可復原")) return;
  try{
    await db.ref(DB_ROOT+"/amounts").remove();
    form.querySelectorAll("input").forEach(i=>i.value="");
    preview();
  }catch(e){ alert("清除失敗："+e.message); }
};
</script>
</body>
</html>
