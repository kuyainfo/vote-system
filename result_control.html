<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>公布結果 - 控制器</title>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<style>
:root{--bg:#0b1020;--gold:#f5c451;--txt:#eef1fa;--sub:#98a2c4;--line:#2c3557}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{min-height:100%}
body{background:radial-gradient(120% 60% at 50% 0%,#1d2748 0%,var(--bg) 60%);color:var(--txt);
  font-family:"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:28px 20px;text-align:center;min-height:100vh}
.kick{font-size:12px;letter-spacing:.5em;color:var(--gold);margin-bottom:10px}
h1{font-size:24px;letter-spacing:.1em;margin-bottom:26px}

.steps{display:flex;gap:22px;align-items:stretch;flex-wrap:wrap;justify-content:center}
.step{display:flex;flex-direction:column;align-items:center;gap:14px}
.step .no{font-size:11px;letter-spacing:.34em;color:var(--sub)}

.big{width:min(38vw,260px);height:min(38vw,260px);min-width:200px;min-height:200px;
  border-radius:50%;border:none;cursor:pointer;
  background:linear-gradient(160deg,var(--gold),#e0a92f);color:#241a00;
  font-family:inherit;font-size:24px;font-weight:800;letter-spacing:.08em;
  box-shadow:0 0 0 9px rgba(245,196,81,.10),0 18px 44px rgba(245,196,81,.24);
  transition:.18s;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:7px}
.big .sm{font-size:12px;font-weight:600;letter-spacing:.28em;opacity:.7}
.big:active:not(:disabled){transform:scale(.96)}
.big:disabled{background:#242c4a;color:#5c668c;box-shadow:none;cursor:default}
.big.done{background:#1e3a2c;color:#6fd39b;box-shadow:none;cursor:default}

.tip{font-size:12px;color:var(--sub);line-height:1.7;max-width:230px;min-height:34px}
.state{margin-top:30px;display:inline-flex;align-items:center;gap:9px;padding:9px 18px;border-radius:22px;
  border:1px solid var(--line);background:rgba(21,28,51,.7);font-size:13px;color:var(--sub)}
.state .d{width:9px;height:9px;border-radius:50%;background:#8e9ac0}
.state.off .d{background:#e0555f}
.note{margin-top:14px;font-size:11px;color:#4d5678;letter-spacing:.1em;line-height:1.9;max-width:380px}

.confirm{position:fixed;inset:0;background:rgba(8,13,28,.93);display:none;
  align-items:center;justify-content:center;flex-direction:column;padding:28px;z-index:50}
.confirm.on{display:flex}
.confirm h2{font-size:22px;margin-bottom:12px;letter-spacing:.06em}
.confirm p{font-size:14px;color:var(--sub);line-height:1.8;margin-bottom:26px}
.confirm .btns{display:flex;gap:12px}
.confirm button{padding:15px 30px;border-radius:11px;font-family:inherit;font-size:16px;font-weight:700;
  border:1px solid var(--line);background:#1b2340;color:var(--txt)}
.confirm button.yes{background:linear-gradient(160deg,var(--gold),#e0a92f);color:#241a00;border:none}
.confirm button.yes:disabled{background:#242c4a;color:#5c668c}
</style>
</head>
<body>

<div class="kick">HOST CONTROLLER</div>
<h1>公布結果</h1>

<div class="steps">
  <div class="step">
    <div class="no">STEP 1</div>
    <button class="big" id="b1">公布前三名<span class="sm">TOP 3</span></button>
    <div class="tip" id="t1">投影-1 播放第三名 → 第二名 → 第一名 → 頒獎台</div>
  </div>
  <div class="step">
    <div class="no">STEP 2</div>
    <button class="big" id="b2" disabled>最佳潛力獎<span class="sm">SPECIAL</span></button>
    <div class="tip" id="t2">前三名播完後才會解鎖</div>
  </div>
</div>

<div class="state" id="stateBox"><span class="d"></span><span id="stateTxt">連線中…</span></div>
<div class="note">此頁僅供工作人員操作，請勿提供給觀眾。<br>需重播時，請至後台按對應的重置按鈕。</div>

<div class="confirm" id="cf">
  <h2 id="cfTitle">確定要公布？</h2>
  <p id="cfDesc">投影畫面會立刻開始播放。</p>
  <div class="btns">
    <button id="no">取消</button>
    <button class="yes" id="yes" disabled>確定公布</button>
  </div>
</div>

<script>
/* ===================== 設定區 ===================== */
const FB_CONFIG = {
  apiKey:            "AIzaSyDl_NqANwk_lsfEL5kOyC1RJi29DLvGPU8",
  authDomain:        "kuya-candy-game.firebaseapp.com",
  databaseURL:       "https://kuya-candy-game-default-rtdb.firebaseio.com",
  projectId:         "kuya-candy-game",
  storageBucket:     "kuya-candy-game.firebasestorage.app",
  messagingSenderId: "105923267148",
  appId:             "1:105923267148:web:1f0e0db9de8cc2876c42e9"
};
const DB_ROOT      = "result";
const TOP3_LENGTH  = 13000;  /* 前三名動畫總長，需與 result_screen 的 T.podium 一致 */
const CONFIRM_HOLD = 1200;   /* 確認鍵防誤按延遲（毫秒） */
/* ================================================== */

firebase.initializeApp(FB_CONFIG);
const db=firebase.database();

const b1=document.getElementById("b1"), b2=document.getElementById("b2");
const t1=document.getElementById("t1"), t2=document.getElementById("t2");
const box=document.getElementById("stateBox"), txt=document.getElementById("stateTxt");
const cf=document.getElementById("cf"), yes=document.getElementById("yes");

let reveal="idle", potential="idle", revealAt=0, offset=0, online=true;
let pending=null, holdTimer=null, tick=null;

function elapsed(){ return revealAt ? (Date.now()+offset-revealAt) : 0; }

function sync(){
  const top3Done = (reveal==="running") && (elapsed() >= TOP3_LENGTH);

  b1.classList.toggle("done", reveal==="running");
  b1.disabled = (reveal==="running") || !online;
  b1.childNodes[0].nodeValue = reveal==="running" ? "已公布" : "公布前三名";
  t1.textContent = reveal==="running"
    ? "已公布，投影-1 播放中／已完成"
    : "投影-1 播放第三名 → 第二名 → 第一名 → 頒獎台";

  b2.classList.toggle("done", potential==="running");
  b2.disabled = (potential==="running") || !top3Done || !online;
  b2.childNodes[0].nodeValue = potential==="running" ? "已公布" : "最佳潛力獎";
  if(potential==="running")      t2.textContent="已公布，投影-2 顯示中";
  else if(reveal!=="running")    t2.textContent="前三名播完後才會解鎖";
  else if(!top3Done){
    const left=Math.max(0,Math.ceil((TOP3_LENGTH-elapsed())/1000));
    t2.textContent="前三名播放中，"+left+" 秒後解鎖";
  }
  else t2.textContent="投影-2 顯示最佳潛力獎";

  box.classList.toggle("off",!online);
  txt.textContent = !online ? "連線中斷，請檢查網路"
    : (potential==="running" ? "全部已公布"
    : (reveal==="running" ? (top3Done?"前三名已完成，可公布潛力獎":"前三名播放中") : "待命中"));
}

function startTick(){
  if(tick) clearInterval(tick);
  tick=setInterval(sync,500);
}
startTick();

db.ref(DB_ROOT+"/reveal").on("value", s=>{ reveal=s.val()||"idle"; sync(); });
db.ref(DB_ROOT+"/revealAt").on("value", s=>{ revealAt=s.val()||0; sync(); });
db.ref(DB_ROOT+"/potential").on("value", s=>{ potential=s.val()||"idle"; sync(); });
db.ref(".info/serverTimeOffset").on("value", s=>{ offset=s.val()||0; });
db.ref(".info/connected").on("value", s=>{ online=!!s.val(); sync(); });

function ask(which){
  pending=which;
  document.getElementById("cfTitle").textContent =
    which==="top3" ? "確定公布前三名？" : "確定公布最佳潛力獎？";
  document.getElementById("cfDesc").innerHTML =
    which==="top3" ? "投影-1 會立刻開始播放揭曉動畫，<br>播放中無法中止。"
                   : "投影-2 會立刻顯示最佳潛力獎，<br>顯示後無法中止。";
  yes.disabled=true; yes.textContent="請稍候…";
  cf.classList.add("on");
  clearTimeout(holdTimer);
  holdTimer=setTimeout(()=>{ yes.disabled=false; yes.textContent="確定公布"; }, CONFIRM_HOLD);
}

b1.onclick=()=>{ if(!b1.disabled) ask("top3"); };
b2.onclick=()=>{ if(!b2.disabled) ask("potential"); };
document.getElementById("no").onclick=()=>{ cf.classList.remove("on"); pending=null; };

yes.onclick = async ()=>{
  if(!pending) return;
  const which=pending; pending=null;
  cf.classList.remove("on");
  try{
    if(which==="top3"){
      await db.ref(DB_ROOT).update({ reveal:"running", revealAt: firebase.database.ServerValue.TIMESTAMP });
    }else{
      await db.ref(DB_ROOT).update({ potential:"running", potentialAt: firebase.database.ServerValue.TIMESTAMP });
    }
  }catch(e){
    alert("公布失敗："+e.message+"\n請重試");
  }
  sync();
};
</script>
</body>
</html>
