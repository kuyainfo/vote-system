<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>實際結果 - 投影畫面</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@700;900&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<style>
:root{--g1:#f25bd6;--g2:#8b7bff;--g3:#34e4f2;--glass:rgba(20,24,92,.40);
  --gold:#ffd66b;--silver:#e3e9f7;--bronze:#f2b27c;--sub:rgba(225,232,255,.72)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#050926;color:#fff;
  font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}

/* 1920×1080 固定畫布，依螢幕等比縮放（底圖含主標題） */
#canvas{position:absolute;left:50%;top:50%;width:1920px;height:1080px;margin:-540px 0 0 -960px;
  background:url("assets/bg.jpg") center/cover no-repeat;overflow:hidden;transform-origin:50% 50%}
.layer{position:absolute;inset:0;opacity:0;pointer-events:none;transition:opacity .6s ease}
.layer.on{opacity:1}

/* 等待畫面：公布結果按鈕（僅顯示，由手機控制） */
#idle,#top3{display:flex;flex-direction:column;align-items:center;justify-content:center;padding-top:240px}
.ph-kick{font-size:22px;letter-spacing:.8em;color:var(--g3);margin-bottom:28px;font-weight:700}
.ph-h1{font-size:92px;letter-spacing:.18em;font-weight:900;text-shadow:0 0 40px rgba(139,123,255,.6)}
.pbtn{position:relative;width:440px;height:440px;border-radius:50%;
  background:linear-gradient(135deg,var(--g1),var(--g2) 50%,var(--g3));
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;
  animation:breathe 2.6s ease-in-out infinite}
.pbtn::before{content:"";position:absolute;inset:0;border-radius:50%;border:5px solid rgba(255,255,255,.7);opacity:0}
.pb-lb{font-size:78px;font-weight:900;letter-spacing:.12em;padding-left:.12em;line-height:1;
  text-shadow:0 4px 18px rgba(40,20,120,.45)}
.pb-sm{font-size:22px;font-weight:700;letter-spacing:.5em;padding-left:.5em;opacity:.85}
@keyframes breathe{
  0%,100%{box-shadow:0 0 0 14px rgba(255,255,255,.08),0 0 60px rgba(139,123,255,.5)}
  50%{box-shadow:0 0 0 28px rgba(255,255,255,.05),0 0 130px rgba(52,228,242,.7)}}
.pbtn.press{animation:press .9s cubic-bezier(.3,1.4,.5,1) both}
.pbtn.press::before{animation:ripple .9s ease-out both}
@keyframes press{0%{transform:scale(1)}25%{transform:scale(.86)}60%{transform:scale(1.05)}100%{transform:scale(1)}}
@keyframes ripple{0%{opacity:.95;transform:scale(1)}100%{opacity:0;transform:scale(2)}}
.ph-tag{margin-top:44px;padding:14px 36px;border:3px dashed rgba(255,255,255,.35);border-radius:14px;
  font-size:26px;letter-spacing:.4em;color:var(--sub)}

/* 開獎畫面 */
.glass{position:absolute;border:4px solid transparent;border-radius:44px;
  background:linear-gradient(var(--glass),var(--glass)) padding-box,
             linear-gradient(100deg,var(--g1),var(--g2) 50%,var(--g3)) border-box;
  -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
  box-shadow:0 0 44px rgba(139,123,255,.38);
  display:flex;flex-direction:column;align-items:center;justify-content:center}
#rankBox{left:870px;top:300px;width:900px;height:160px}
#sRank{font-size:88px;font-weight:900;letter-spacing:.3em;padding-left:.3em;line-height:1}
.r1{color:var(--gold);text-shadow:0 0 34px rgba(255,214,107,.7)}
.r2{color:var(--silver);text-shadow:0 0 34px rgba(227,233,247,.6)}
.r3{color:var(--bronze);text-shadow:0 0 34px rgba(242,178,124,.65)}

#infoBox{left:870px;top:500px;width:920px;height:440px;padding:0 60px}
#sName{width:800px;text-align:center;white-space:nowrap;font-size:64px;font-weight:900;
  letter-spacing:.04em;line-height:1.2}
#sAmt{margin-top:34px;font-size:156px;font-weight:900;line-height:1;font-variant-numeric:tabular-nums;
  text-shadow:0 0 36px rgba(52,228,242,.55)}
#sAmt small{font-size:60px;margin-left:16px;font-weight:700;color:var(--sub);text-shadow:none}

#logoWrap{position:absolute;left:130px;top:300px;width:640px;height:640px;border-radius:50%;padding:9px;
  background:linear-gradient(135deg,var(--g1),var(--g2),var(--g3));
  box-shadow:0 0 64px rgba(139,123,255,.6)}
#sLogo{width:100%;height:100%;border-radius:50%;object-fit:cover;display:block;background:#fff}

/* 進場 */
#stage.enter #rankBox{animation:inR .7s cubic-bezier(.2,1,.25,1) both}
#stage.enter #infoBox{animation:inU .8s .08s cubic-bezier(.2,1,.25,1) both}
#stage.enter #logoWrap{animation:inS .8s cubic-bezier(.2,1,.25,1) both}
@keyframes inR{from{opacity:0;transform:translateX(80px)}to{opacity:1;transform:none}}
@keyframes inU{from{opacity:0;transform:translateY(60px)}to{opacity:1;transform:none}}
@keyframes inS{from{opacity:0;transform:scale(.8)}to{opacity:1;transform:none}}

/* 停下時的彈跳 */
#logoWrap.land{animation:landPop .7s cubic-bezier(.3,1.6,.5,1) both}
#sName.land{animation:namePop .6s cubic-bezier(.3,1.6,.5,1) both}
@keyframes landPop{0%{transform:scale(1)}40%{transform:scale(1.1);box-shadow:0 0 140px rgba(52,228,242,.9)}100%{transform:scale(1)}}
@keyframes namePop{0%{transform:scale(1)}40%{transform:scale(1.12)}100%{transform:scale(1)}}

.warn{position:absolute;left:40px;bottom:24px;font-size:22px;color:#ff6b7a;letter-spacing:.16em;display:none}
.warn.on{display:block}
</style>
</head>
<body>
<div id="canvas">

  <div class="layer on" id="idle">
    <div class="pbtn" id="idleBtn"><span class="pb-lb">公布結果</span><span class="pb-sm">FINAL RESULT</span></div>
  </div>

  <div class="layer" id="stage">
    <div class="glass" id="rankBox"><div id="sRank" class="r3">第三名</div></div>
    <div id="logoWrap"><img id="sLogo" alt=""></div>
    <div class="glass" id="infoBox">
      <div id="sName">—</div>
      <div id="sAmt">0<small>萬</small></div>
    </div>
  </div>

  <!-- 前三名總覽：視覺待設計，目前為佔位畫面 -->
  <div class="layer" id="top3">
    <div class="ph-kick">TOP 3</div>
    <div class="ph-h1">前三名總覽</div>
    <div class="ph-tag">畫面設計中</div>
  </div>

  <div class="warn" id="warn">連線中斷</div>
</div>

<script>
/* ===================== 設定區 ===================== */
const FB_CONFIG = {
  apiKey:            "AIzaSyDl_NqANwk_lsfEL5kOyC1RJi29DLvGPU8",
  authDomain:        "kuya-candy-game.firebaseapp.com",
  databaseURL:       "https://kuya-candy-game-default-rtdb.firebaseio.com",
  projectId:         "kuya-candy-game",
  storageBucket:     "kuya-candy-game.firebasestorage.app",
  messagingSenderId: "105923267148",
  appId:             "1:105923267148:web:1f0e0db9de8cc2876c42e9"
};
const DB_ROOT = "result";
/* 隊伍資料：編號需與後台 result_admin.html 一致；logo 圖檔放在 assets/logos/ */
const TEAMS = [
  {no:1,  name:"星相科技股份有限公司",       logo:"assets/logos/xingxiang.png"},
  {no:2,  name:"長瑩生技股份有限公司",       logo:"assets/logos/changying.png"},
  {no:3,  name:"零邁移動服務股份有限公司",   logo:"assets/logos/lingmai.png"},
  {no:4,  name:"臻至科技有限公司",           logo:"assets/logos/zhenzhi.png"},
  {no:5,  name:"台灣若美科技股份有限公司",   logo:"assets/logos/ruomei.png"},
  {no:6,  name:"超術感醫學科技股份有限公司", logo:"assets/logos/chaoshugan.png"},
  {no:7,  name:"岳鼎智慧能源股份有限公司",   logo:"assets/logos/yueding.png"},
  {no:8,  name:"多多多比有限公司",           logo:"assets/logos/duoduoduobi.png"},
  {no:9,  name:"越創科技股份有限公司",       logo:"assets/logos/yuechuang.png"},
  {no:10, name:"寵訊生醫股份有限公司",       logo:"assets/logos/chongxun.png"}
];
const SPIN_MS  = 2500;   /* Logo、公司名稱輪播與金額跳動的時間（毫秒） */
const PRESS_MS = 1000;   /* 投影按鈕按下動畫時間（毫秒） */
const STEP_MAX = 4;      /* 0 等待／1 第三名／2 第二名／3 第一名／4 前三名總覽 */
/* ================================================== */

firebase.initializeApp(FB_CONFIG);
const db=firebase.database();

const $=id=>document.getElementById(id);
const canvas=$("canvas"), stageEl=$("stage"), logoWrap=$("logoWrap"), logoEl=$("sLogo"),
      nameEl=$("sName"), amtEl=$("sAmt"), rankEl=$("sRank"), idleBtn=$("idleBtn");
let amounts={}, amountsReady=false, step=0, token=0, lastStep=null, pressTimer=null;

/* 預先載入 Logo，輪播時不閃爍 */
TEAMS.forEach(t=>{ const i=new Image(); i.src=t.logo; });

function fitCanvas(){
  const s=Math.min(innerWidth/1920, innerHeight/1080);
  canvas.style.transform="scale("+s+")";
}
addEventListener("resize", fitCanvas);
fitCanvas();

function ranked(){
  return TEAMS.map(t=>({...t, v:+(amounts[t.no]||0)}))
              .sort((a,b)=> b.v-a.v || a.no-b.no);
}
function show(id){
  ["idle","stage","top3"].forEach(k=>$(k).classList.toggle("on", k===id));
}

/* 公司名稱過長時自動縮小字級 */
function fitName(){
  let s=64; nameEl.style.fontSize=s+"px";
  while(nameEl.scrollWidth>nameEl.clientWidth && s>34){ s-=2; nameEl.style.fontSize=s+"px"; }
}
function setTeam(t){
  logoEl.src=t.logo;
  nameEl.textContent=t.name;
  fitName();
}

function countUp(to, my){
  const t0=performance.now();
  (function run(now){
    if(my!==token) return;
    const p=Math.min(1,(now-t0)/SPIN_MS), e=1-Math.pow(1-p,3);
    amtEl.innerHTML=Math.round(to*e).toLocaleString()+"<small>萬</small>";
    if(p<1) requestAnimationFrame(run);
  })(t0);
}

function spin(win, my){
  const t0=performance.now();
  let cur=null, nextAt=t0;
  logoWrap.classList.remove("land");
  nameEl.classList.remove("land");
  (function tick(now){
    if(my!==token) return;
    const p=(now-t0)/SPIN_MS;
    if(p>=1){
      setTeam(win);
      void logoWrap.offsetWidth;
      logoWrap.classList.add("land");
      nameEl.classList.add("land");
      return;
    }
    if(now>=nextAt){
      let c;
      do{ c=TEAMS[Math.floor(Math.random()*TEAMS.length)]; }while(TEAMS.length>1 && c===cur);
      cur=c; setTeam(c);
      nextAt = now + 55 + 330*Math.pow(p,2.2);   /* 越轉越慢 */
    }
    requestAnimationFrame(tick);
  })(t0);
}

function showStage(rank){
  const win=ranked()[rank-1];
  if(!win) return;
  const my=++token;
  rankEl.textContent = rank===1?"第一名":(rank===2?"第二名":"第三名");
  rankEl.className = "r"+rank;
  stageEl.classList.remove("enter"); void stageEl.offsetWidth; stageEl.classList.add("enter");
  show("stage");
  spin(win, my);
  countUp(win.v, my);
}

function render(withPress){
  if(!amountsReady) return;
  clearTimeout(pressTimer);
  idleBtn.classList.remove("press");
  if(withPress){
    /* 手機按下第 1 下：投影按鈕先播按下動畫，再進第三名 */
    token++;
    show("idle");
    void idleBtn.offsetWidth;
    idleBtn.classList.add("press");
    pressTimer=setTimeout(()=>showStage(3), PRESS_MS);
    return;
  }
  if(step>=1 && step<=3) showStage(4-step);
  else { token++; show(step>=STEP_MAX ? "top3" : "idle"); }
}

db.ref(DB_ROOT+"/amounts").on("value", s=>{
  amounts=s.val()||{};
  const first=!amountsReady;
  amountsReady=true;
  if(first || (step>=1 && step<=3)) render();
});
db.ref(DB_ROOT+"/step").on("value", s=>{
  const v=parseInt(s.val(),10);
  step = isNaN(v) ? 0 : Math.max(0, Math.min(STEP_MAX, v));
  const prev=lastStep; lastStep=step;
  render(prev===0 && step===1);   /* 中途重新整理不會重播按鈕動畫 */
});
db.ref(".info/connected").on("value", s=>{ $("warn").classList.toggle("on", !s.val()); });
</script>
</body>
</html>
